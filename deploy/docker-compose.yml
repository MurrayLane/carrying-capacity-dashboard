# Runs the dashboard on a single VPS behind Caddy.
# Usage (on the server):  docker compose pull && docker compose up -d
services:
  dashboard:
    image: ghcr.io/murraylane/carrying-capacity-dashboard:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # only Caddy on this host can reach Tomcat
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
