name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: docker/login-action@v1
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME  }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - uses: actions/checkout@v3
    - name: Build and push the Docker image
      run: |
        docker build . --file Dockerfile --tag ${{ vars.REPOSITORY }}:${{ github.event.repository.updated_at}}
        docker push ${{ vars.REPOSITORY }}:${{ github.event.repository.updated_at}}
