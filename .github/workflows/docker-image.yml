name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:


jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: docker/login-action@v1
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME  }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - uses: actions/checkout@v3
    - name: Build and push the Docker image
      run: |
        docker build --pull . --file Dockerfile --tag ${{ vars.REPOSITORY }}:${{ github.run_number }} --tag ${{ vars.REPOSITORY }}:latest
        docker push ${{ vars.REPOSITORY }}:${{ github.run_number }}
        docker push ${{ vars.REPOSITORY }}:latest
