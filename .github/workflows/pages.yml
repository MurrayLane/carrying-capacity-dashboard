name: Test and publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Yield method tests (no archive needed)
        run: |
          python3 -m unittest discover -s ../pipeline/yields -p 'test_*.py'
          python3 -m unittest discover -s ../pipeline/yields/abs_current -p 'test_*.py'

      # Replays the 120 default cases of the 2011 servlet through the browser evaluator
      - name: Regression test against the 2011 baseline
        run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    # Fails harmlessly until Pages is enabled (Settings, Pages, Source: GitHub Actions)
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
